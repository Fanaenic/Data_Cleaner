# .github/workflows/ci.yml
# CI/CD пайплайн: тесты → сборка образов → деплой (при пуше в main)

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:

  # ── 1. Тесты бэкенда ─────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run backend tests with coverage
        run: |
          cd backend
          pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing
        env:
          DATABASE_URL: sqlite:///./tests/test_ci.db
          SECRET_KEY: ci-test-secret-key-minimum-32-chars!!
          ADMIN_EMAIL: admin@ci.test
          ADMIN_USERNAME: ciadmin
          ADMIN_NAME: CI Admin
          ADMIN_PASSWORD: CIAdmin123!
          SITE_URL: http://localhost:3000

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: backend/coverage.xml
          flags: backend

  # ── 2. Линтер бэкенда ────────────────────────────────────────────────────
  lint-backend:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: pip install flake8

      - name: Run flake8
        run: |
          cd backend
          flake8 . --max-line-length=120 --exclude=__pycache__,tests,uploads --count --statistics

  # ── 3. Тесты фронтенда ────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run frontend tests
        run: cd frontend && npm test -- --watchAll=false --coverage --passWithNoTests
        env:
          CI: true

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          flags: frontend

  # ── 4. Сборка Docker-образов ──────────────────────────────────────────────
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [ test-backend, test-frontend ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: datacleaner-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: datacleaner-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate docker-compose config
        run: docker compose config
        env:
          SECRET_KEY: test-key
          ADMIN_EMAIL: admin@test.com
          ADMIN_USERNAME: admin
          ADMIN_NAME: Admin
          ADMIN_PASSWORD: Admin123!

  # ── 5. Деплой (только main ветка) ────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ build-docker ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "✅ All checks passed for commit ${{ github.sha }}"
          echo "🚀 Ready to deploy to production"
          echo "Run: docker compose up --build -d"
